[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localstack-extension-pgvector"
version = "0.1.0"
authors = [
  { name="Muhammad Ikhwan Fathulloh", email="muhammadikhwanfathulloh17@gmail.com" },
]
description = "LocalStack extension to enable pgvector automatically"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Nocturnailed-Community/localstack-extension-pgvector"
