[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localstack-extension-pgvector"
version = "0.2.0"
authors = [
  { name="Muhammad Ikhwan Fathulloh", email="muhammadikhwanfathulloh17@gmail.com" },
]
description = "LocalStack extension to enable pgvector automatically"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["localstack", "extension", "pgvector", "postgres", "vector-search"]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Intended Audience :: Developers",
]
dependencies = [
    "localstack-ext>=1.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.urls]
"Homepage" = "https://github.com/Nocturnailed-Community/localstack-extension-pgvector"
"Bug Tracker" = "https://github.com/Nocturnailed-Community/localstack-extension-pgvector/issues"
"Source Code" = "https://github.com/Nocturnailed-Community/localstack-extension-pgvector"

[project.entry-points."localstack.extensions"]
pgvector = "extension:PgVectorExtension"

[tool.setuptools]
py-modules = ["extension"]

[tool.setuptools.package-data]
"*" = ["*.sql", "*.png"]
